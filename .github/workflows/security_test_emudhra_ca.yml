name: eMudhra CA Security Test

on:
  push:
    branches:
      - security-emudhra-verify
  workflow_dispatch:

jobs:
  security-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04-arm
          - macos-15
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Run eMudhra CA security test
        shell: bash
        run: ./tools/securityTest_eMudhraCA.sh

